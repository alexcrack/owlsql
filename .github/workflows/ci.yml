# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.12.0"
  CLANG_FORMAT_VERSION: "21.1.8"
  CLANG_TIDY_VERSION: "21.1.6"

jobs:
  build:
    name: Build & test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            qt_arch: linux_gcc_64
          - name: Windows
            os: windows-2022
            qt_arch: win64_msvc2022_64
            # aqtinstall 3.3.0 can't find Qt 6.12's per-compiler Windows repository layout.
            # TODO: drop once an aqtinstall release (> 3.3.0) supports it.
            aqtsource: git+https://github.com/miurahr/aqtinstall.git@4c759852b1108cc801d8e24979136b895b5155d4
          - name: macOS
            os: macos-15
            qt_arch: clang_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl-dev libegl-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1-dev libvulkan-dev libdbus-1-3 libsecret-1-dev

      - name: Install Ninja
        run: pip install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          aqtsource: ${{ matrix.aqtsource || '' }}
          cache: true

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up dependencies (vcpkg, Qt-based libraries)
        uses: ./.github/actions/setup-deps

      # Integration tests run against real servers on Linux only (decision 125): the latest
      # PostgreSQL and the oldest supported one (decision 048).
      - name: Start PostgreSQL 18 and 13
        if: runner.os == 'Linux'
        run: |
          docker run -d --name owl-pg18 -e POSTGRES_PASSWORD=owlsql -p 5432:5432 postgres:18
          docker run -d --name owl-pg13 -e POSTGRES_PASSWORD=owlsql -p 5433:5432 postgres:13
          for pg in owl-pg18 owl-pg13; do
            for i in $(seq 1 60); do docker exec $pg pg_isready -U postgres -h 127.0.0.1 && break; sleep 1; done
          done
          echo "OWL_TEST_PG_URL=postgresql://postgres:owlsql@localhost:5432/postgres" >> "$GITHUB_ENV"
          echo "OWL_TEST_PG13_URL=postgresql://postgres:owlsql@localhost:5433/postgres" >> "$GITHUB_ENV"
          echo "OWL_REQUIRE_INTEGRATION_TESTS=1" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

  lint:
    name: Format & lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl-dev libegl-dev libxkbcommon-dev libfontconfig1-dev libvulkan-dev libsecret-1-dev
          pip install ninja clang-format==${{ env.CLANG_FORMAT_VERSION }} clang-tidy==${{ env.CLANG_TIDY_VERSION }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true

      - name: Check formatting (clang-format, qmlformat)
        run: QMLFORMAT="$QT_ROOT_DIR/bin/qmlformat" tools/check-format.sh

      - name: Set up dependencies (vcpkg, Qt-based libraries)
        uses: ./.github/actions/setup-deps

      - name: Configure & build (generates moc and compile_commands.json)
        run: |
          cmake --preset ci
          cmake --build --preset ci

      - name: clang-tidy
        run: clang-tidy -p build/ci --quiet --warnings-as-errors='*' $(git ls-files '*.cpp')

      - name: qmllint
        run: cmake --build --preset ci --target all_qmllint
