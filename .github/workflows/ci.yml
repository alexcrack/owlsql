# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.12.0"
  CLANG_FORMAT_VERSION: "21.1.8"
  CLANG_TIDY_VERSION: "21.1.6"

jobs:
  build:
    name: Build & test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            qt_arch: linux_gcc_64
          - name: Windows
            os: windows-2022
            qt_arch: win64_msvc2022_64
            # aqtinstall 3.3.0 can't find Qt 6.12's per-compiler Windows repository layout.
            # TODO: drop once an aqtinstall release (> 3.3.0) supports it.
            aqtsource: git+https://github.com/miurahr/aqtinstall.git@4c759852b1108cc801d8e24979136b895b5155d4
          - name: macOS
            os: macos-15
            qt_arch: clang_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl-dev libegl-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1-dev libvulkan-dev libdbus-1-3 libsecret-1-dev

      - name: Install Ninja
        run: pip install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          aqtsource: ${{ matrix.aqtsource || '' }}
          cache: true

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up dependencies (vcpkg, Qt-based libraries)
        uses: ./.github/actions/setup-deps

      # Integration tests run against real servers on Linux only (decision 125): the newest and
      # the oldest supported version of each engine (decisions 048, 151, 161). The images listen
      # on TCP only once initialisation is complete, so the readiness checks use 127.0.0.1.
      - name: Start database servers
        if: runner.os == 'Linux'
        run: |
          docker run -d --name owl-pg18 -e POSTGRES_PASSWORD=owlsql -p 5432:5432 postgres:18
          docker run -d --name owl-pg13 -e POSTGRES_PASSWORD=owlsql -p 5433:5432 postgres:13
          docker run -d --name owl-mysql84 -e MYSQL_ROOT_PASSWORD=owlsql -e MYSQL_DATABASE=owl -p 3306:3306 mysql:8.4
          docker run -d --name owl-mysql57 -e MYSQL_ROOT_PASSWORD=owlsql -e MYSQL_DATABASE=owl -p 3307:3306 mysql:5.7
          docker run -d --name owl-mariadb118 -e MARIADB_ROOT_PASSWORD=owlsql -e MARIADB_DATABASE=owl -p 3308:3306 mariadb:11.8
          docker run -d --name owl-mariadb106 -e MARIADB_ROOT_PASSWORD=owlsql -e MARIADB_DATABASE=owl -p 3309:3306 mariadb:10.6
          wait_for() { # <container> <command…>
            local name=$1; shift
            for i in $(seq 1 120); do docker exec "$name" "$@" >/dev/null 2>&1 && return 0; sleep 1; done
            echo "$name did not become ready"; docker logs "$name" | tail -50; return 1
          }
          wait_for owl-pg18 pg_isready -U postgres -h 127.0.0.1
          wait_for owl-pg13 pg_isready -U postgres -h 127.0.0.1
          wait_for owl-mysql84 mysqladmin ping -h 127.0.0.1 -uroot -powlsql
          wait_for owl-mysql57 mysqladmin ping -h 127.0.0.1 -uroot -powlsql
          wait_for owl-mariadb118 mariadb-admin ping -h 127.0.0.1 -uroot -powlsql
          wait_for owl-mariadb106 mariadb-admin ping -h 127.0.0.1 -uroot -powlsql
          {
            echo "OWL_TEST_PG_URL=postgresql://postgres:owlsql@localhost:5432/postgres"
            echo "OWL_TEST_PG13_URL=postgresql://postgres:owlsql@localhost:5433/postgres"
            echo "OWL_TEST_MYSQL_URL=mysql://root:owlsql@127.0.0.1:3306/owl"
            echo "OWL_TEST_MYSQL57_URL=mysql://root:owlsql@127.0.0.1:3307/owl"
            echo "OWL_TEST_MARIADB_URL=mariadb://root:owlsql@127.0.0.1:3308/owl"
            echo "OWL_TEST_MARIADB106_URL=mariadb://root:owlsql@127.0.0.1:3309/owl"
            echo "OWL_REQUIRE_INTEGRATION_TESTS=1"
          } >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

  lint:
    name: Format & lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl-dev libegl-dev libxkbcommon-dev libfontconfig1-dev libvulkan-dev libsecret-1-dev
          pip install ninja clang-format==${{ env.CLANG_FORMAT_VERSION }} clang-tidy==${{ env.CLANG_TIDY_VERSION }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true

      - name: Check formatting (clang-format, qmlformat)
        run: QMLFORMAT="$QT_ROOT_DIR/bin/qmlformat" tools/check-format.sh

      - name: Set up dependencies (vcpkg, Qt-based libraries)
        uses: ./.github/actions/setup-deps

      - name: Configure & build (generates moc and compile_commands.json)
        run: |
          cmake --preset ci
          cmake --build --preset ci

      - name: clang-tidy
        run: clang-tidy -p build/ci --quiet --warnings-as-errors='*' $(git ls-files '*.cpp')

      - name: qmllint
        run: cmake --build --preset ci --target all_qmllint
