# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.12.0"
  CLANG_FORMAT_VERSION: "21.1.8"
  CLANG_TIDY_VERSION: "21.1.6"

jobs:
  build:
    name: Build & test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            qt_arch: linux_gcc_64
          - name: Windows
            os: windows-2022
            qt_arch: win64_msvc2022_64
            # aqtinstall 3.3.0 can't find Qt 6.12's per-compiler Windows repository layout.
            # TODO: drop once an aqtinstall release (> 3.3.0) supports it.
            aqtsource: git+https://github.com/miurahr/aqtinstall.git@4c759852b1108cc801d8e24979136b895b5155d4
          - name: macOS
            os: macos-15
            qt_arch: clang_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl-dev libegl-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1-dev libvulkan-dev libdbus-1-3

      - name: Install Ninja
        run: pip install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          aqtsource: ${{ matrix.aqtsource || '' }}
          cache: true

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

  lint:
    name: Format & lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl-dev libegl-dev libxkbcommon-dev libfontconfig1-dev libvulkan-dev
          pip install ninja clang-format==${{ env.CLANG_FORMAT_VERSION }} clang-tidy==${{ env.CLANG_TIDY_VERSION }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true

      - name: Check formatting (clang-format, qmlformat)
        run: QMLFORMAT="$QT_ROOT_DIR/bin/qmlformat" tools/check-format.sh

      - name: Configure & build (generates moc and compile_commands.json)
        run: |
          cmake --preset ci
          cmake --build --preset ci

      - name: clang-tidy
        run: clang-tidy -p build/ci --quiet --warnings-as-errors='*' $(git ls-files '*.cpp')

      - name: qmllint
        run: cmake --build --preset ci --target all_qmllint

  # TEMPORARY: reproduce the intermittent tst_settings failure on Windows (PR #7 run 45780565142,
  # no output, "Failed" after 0.4 s). Remove once the cause is fixed.
  windows-settings-stress:
    name: Diagnose tst_settings (Windows, temporary)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: pip install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@4c759852b1108cc801d8e24979136b895b5155d4
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build tst_settings
        run: |
          cmake --preset ci
          cmake --build --preset ci --target tst_settings

      - name: Run tst_settings 60 times
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: "1"
        run: |
          $exe = "build/ci/tests/unit/tst_settings.exe"
          $fails = 0
          for ($i = 1; $i -le 60; $i++) {
            Remove-Item -ErrorAction SilentlyContinue qtest.log
            $out = & $exe -o qtest.log,txt -o -,txt 2>&1
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              $fails++
              Write-Host ("=== run {0}: exit code {1} (0x{2:X8})" -f $i, $code, $code)
              $out | ForEach-Object { Write-Host $_ }
              if (Test-Path qtest.log) { Write-Host "--- qtest.log:"; Get-Content qtest.log | ForEach-Object { Write-Host $_ } }
            }
          }
          Write-Host "tst_settings failures: $fails / 60"
          if ($fails -gt 0) { exit 1 }
